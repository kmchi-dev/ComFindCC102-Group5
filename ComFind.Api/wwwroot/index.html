<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ComFind - Hardware Search</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header">
    <div class="logo" onclick = "window.location.href='index.html'">
        <span class="logo-mark">C</span>
        <span >ComFind</span>
    </div>

    <div class="choice">
		<span onclick = "window.location.href='about.html'">About</span>
        <span>Search History</span>
    </div>
</header>

<main class="container">

    <section class="search-section">
        <h1>Find Hardware Information</h1>

        <p class="description">
            Search through our collection of computer hardware information.
        </p>

        <div class="search-box">
            <input
                type="text"
                id="searchInput"
                placeholder="Search for CPU, GPU, RAM, SSD..."
                autocomplete="off"
            >

            <button id="searchButton">
                Search
            </button>
        </div>
</main>

<footer>
    <p>ComFind &copy; 2026</p>
</footer>

<script src="script.js">
</script>

</body>
</html>
